services:
  dart-scorekeeper:
    build: .
    ports:
      - "3000:3000"
    environment:
      DART_SCOREKEEPER_SELF_HOSTED: "1"
      DART_SCOREKEEPER_CONFIG_FILE: /data/dart-scorekeeper.config.json
      DB_PROVIDER: libsql
      DATABASE_URL: file:/data/dart-scorekeeper.db
      DATABASE_AUTH_TOKEN: ""
      NEXT_PUBLIC_FEEDBACK_ENDPOINT: ${NEXT_PUBLIC_FEEDBACK_ENDPOINT:-}
    volumes:
      - dart-scorekeeper-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/db').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dart-scorekeeper-data:
