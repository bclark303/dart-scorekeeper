name: Alpha 17 release candidate

on:
  push:
    branches:
      - internal/alpha17-entity-navigation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify version
        run: |
          node -e "if (require('./package.json').version !== '0.5.0-alpha.17') process.exit(1)"
          grep -q 'APP_VERSION = "0.5.0-alpha.17"' lib/appInfo.ts
      - name: Prepare database
        run: npm run db:migrate
      - name: Complete contract suite
        run: |
          npm run db:test
          npm run local:test
          npm run auth:test
          npm run setup:test
          npm run x01:test
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:readiness:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run game-night:board-ops:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test
          npm run board-device:test
          npm run board-device:offline:test
          npm run board-device:pairing:test
          npm run venue-hardware:test
      - run: npm run lint
      - run: npm run build
      - name: Docker build
        run: docker build -t dart-scorekeeper:alpha17 .
      - name: Verify clean app tree
        run: git diff --check
