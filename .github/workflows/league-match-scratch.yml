name: League match scratch verification

on:
  pull_request:
    branches:
      - agent/game-night-framework

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/league-match-scratch-ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: internal/league-match-sessions

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply game-night central match integration
        run: |
          node scripts/apply-league-match-game-night-integration.mjs
          node scripts/apply-league-match-ui.mjs

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Generate central match migration
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Exercise database repository contract
        run: npm run db:test

      - name: Exercise browser archive queue contract
        run: npm run local:test

      - name: Exercise authentication and sync ownership contract
        run: npm run auth:test

      - name: Exercise self-hosted database setup contract
        run: npm run setup:test

      - name: Exercise league framework contract
        run: npm run league:test

      - name: Exercise league player and roster contract
        run: npm run league:roster:test

      - name: Exercise game-night lifecycle contract
        run: npm run game-night:test

      - name: Exercise central league match contract
        run: npm run league-match:test

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-league-match-scratch .

      - name: Commit validated integration and migration artifacts
        if: success()
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/game-nights/page.tsx lib/db/repositories/gameNights.ts drizzle/
            git commit -m "Wire central match sessions into game nights"
            git push
          fi
