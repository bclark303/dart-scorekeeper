name: League migration generator

on:
  pull_request:
    branches:
      - agent/database-setup-preview

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: internal/league-framework-gen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate migration
        run: npm run db:generate

      - name: Commit generated migration artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add drizzle/
          if git diff --cached --quiet; then
            echo "Migration artifacts are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate league framework migration"
          git push origin HEAD:internal/league-framework-gen
