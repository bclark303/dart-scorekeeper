name: Alpha 17 entity navigation

on:
  push:
    branches:
      - internal/alpha17-entity-navigation

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply entity drill-down UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Game Night read models carry the master player id so every real player
          # can link to the existing /players/[playerId] profile from live workflows.
          replace_once(
              "lib/league/gameNightContracts.ts",
              '''export type GameNightAttendanceSummary = {\n  leaguePlayerId: string;''',
              '''export type GameNightAttendanceSummary = {\n  playerId: string;\n  leaguePlayerId: string;''',
          )
          replace_once(
              "lib/league/gameNightContracts.ts",
              '''export type GameNightTeamMemberSummary = {\n  id: string;\n  leaguePlayerId: string | null;''',
              '''export type GameNightTeamMemberSummary = {\n  id: string;\n  playerId: string | null;\n  leaguePlayerId: string | null;''',
          )

          replace_once(
              "lib/db/repositories/gameNights.ts",
              '''    .select({\n      leaguePlayerId: leaguePlayers.id,\n      displayName: players.displayName,\n    })''',
              '''    .select({\n      playerId: players.id,\n      leaguePlayerId: leaguePlayers.id,\n      displayName: players.displayName,\n    })''',
          )
          replace_once(
              "lib/db/repositories/gameNights.ts",
              '''  const matchSessionByPairing = new Map(\n    matchSessionRows.map((session) => [session.pairingId, session]),\n  );\n\n  return {''',
              '''  const matchSessionByPairing = new Map(\n    matchSessionRows.map((session) => [session.pairingId, session]),\n  );\n  const playerIdByLeaguePlayerId = new Map(\n    roster.map((player) => [player.leaguePlayerId, player.playerId]),\n  );\n\n  return {''',
          )
          replace_once(
              "lib/db/repositories/gameNights.ts",
              '''      members: (membersByTeam.get(team.id) ?? []).map((member) => ({\n        id: member.id,\n        leaguePlayerId: member.leaguePlayerId,''',
              '''      members: (membersByTeam.get(team.id) ?? []).map((member) => ({\n        id: member.id,\n        playerId: member.leaguePlayerId\n          ? playerIdByLeaguePlayerId.get(member.leaguePlayerId) ?? null\n          : null,\n        leaguePlayerId: member.leaguePlayerId,''',
          )

          # The League Administration "Tonight" card becomes a set of meaningful
          # drill-down targets instead of one giant generic link.
          p = Path("app/league-play/page.tsx")
          text = p.read_text()
          old = '''                      <div className="mt-1 text-2xl font-black">{activeLeague?.name ?? "League"}</div>\n                      {activeLeague?.seasons[0] && <div className="mt-1 text-sm text-[var(--color-text-muted)]">Current season: {activeLeague.seasons[0].name}</div>}'''
          new = '''                      <Link href="/leagues" className="mt-1 inline-flex items-center gap-2 text-2xl font-black hover:text-[var(--color-primary)]">\n                        {activeLeague?.name ?? "League"} <span aria-hidden="true" className="text-base">→</span>\n                      </Link>\n                      {activeLeague?.seasons[0] && (\n                        <div className="mt-1 text-sm text-[var(--color-text-muted)]">\n                          Current season: <Link href="/leagues" className="font-bold hover:text-[var(--color-primary)]">{activeLeague.seasons[0].name}</Link>\n                        </div>\n                      )}'''
          if old not in text:
              raise SystemExit("League identity block not found")
          text = text.replace(old, new, 1)
          start = text.index('''                  ) : currentNight ? (\n''')
          end = text.index('''                  ) : (\n                    <div className="rounded-3xl border border-dashed border-blue-500/45''', start)
          branch = '''                  ) : currentNight ? (\n                    <article className="rounded-3xl border border-blue-500/50 bg-blue-500/10 p-6 sm:p-8">\n                      <div className="flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">\n                        <div>\n                          <div className="flex flex-wrap items-center gap-2">\n                            <Link href="/game-nights/control" className="rounded-full bg-blue-500/15 px-3 py-1 text-xs font-black uppercase tracking-wide text-blue-200 hover:bg-blue-500/25">\n                              {gameNightStatusLabel(currentNight.status)}\n                            </Link>\n                            <Link href="/game-nights" className="text-sm text-[var(--color-text-muted)] hover:text-[var(--color-primary)]">\n                              {formatScheduledAt(currentNight.scheduledAt)}\n                            </Link>\n                          </div>\n                          <Link href="/game-nights/control" className="group mt-3 inline-flex items-center gap-2">\n                            <h3 className="text-3xl font-black group-hover:text-[var(--color-primary)]">{currentNight.name}</h3>\n                            <span aria-hidden="true" className="text-xl transition group-hover:translate-x-1">→</span>\n                          </Link>\n                          <p className="mt-2 text-[var(--color-text-muted)]">\n                            {currentNight.venueName && currentNight.venueId ? (\n                              <>\n                                At <Link\n                                  href={`/league-devices?leagueId=${encodeURIComponent(activeLeagueId)}&venueId=${encodeURIComponent(currentNight.venueId)}`}\n                                  className="font-bold hover:text-[var(--color-primary)]"\n                                >\n                                  {currentNight.venueName}\n                                </Link>.{" "}\n                              </>\n                            ) : (\n                              <>Venue not chosen yet. </>\n                            )}\n                            Control will tell you what needs attention and what to do next.\n                          </p>\n                          <div className="mt-5 flex flex-wrap gap-2 text-sm font-bold">\n                            <Link href="/game-nights/check-in" className="rounded-full bg-[var(--color-panel)] px-3 py-2 transition hover:ring-2 hover:ring-[var(--color-primary)]">\n                              {checkedIn} checked in →\n                            </Link>\n                            <Link href="/game-nights/boards" className="rounded-full bg-[var(--color-panel)] px-3 py-2 transition hover:ring-2 hover:ring-[var(--color-primary)]">\n                              {currentNight.boards.length} {currentNight.boards.length === 1 ? "dartboard" : "dartboards"} →\n                            </Link>\n                            {totalMatches > 0 && (\n                              <Link href="/game-nights/fixtures" className="rounded-full bg-[var(--color-panel)] px-3 py-2 transition hover:ring-2 hover:ring-[var(--color-primary)]">\n                                {completedMatches}/{totalMatches} games complete →\n                              </Link>\n                            )}\n                          </div>\n                        </div>\n                        <Link href="/game-nights/control" className="group inline-flex min-h-16 shrink-0 items-center justify-center rounded-2xl bg-blue-600 px-7 py-4 text-xl font-black text-white">\n                          {currentNight.status === "active" ? "Continue Game Night" : "Prepare Game Night"}\n                          <span aria-hidden="true" className="ml-2 transition group-hover:translate-x-1">→</span>\n                        </Link>\n                      </div>\n                    </article>\n'''
          text = text[:start] + branch + text[end:]
          p.write_text(text)

          # Player directory: the visible player identity itself is now the profile link.
          replace_once(
              "app/league-roster/page.tsx",
              '''                <div className="mt-3 rounded-xl bg-emerald-500/10 px-4 py-3 text-sm">\n                  <span className="font-bold">Player already exists:</span> {exactNameMatch.displayName}. Use that profile rather than creating another one.\n                </div>''',
              '''                <div className="mt-3 rounded-xl bg-emerald-500/10 px-4 py-3 text-sm">\n                  <span className="font-bold">Player already exists:</span>{" "}\n                  <Link href={`/players/${encodeURIComponent(exactNameMatch.playerId)}`} className="font-black text-[var(--color-primary)] hover:underline">\n                    {exactNameMatch.displayName} →\n                  </Link>{" "}\n                  Use that profile rather than creating another one.\n                </div>''',
          )
          replace_once(
              "app/league-roster/page.tsx",
              '''                          <h3 className="text-xl font-black">{player.displayName}</h3>\n                          <Link\n                            href={`/players/${encodeURIComponent(player.playerId)}`}\n                            className="mt-1 inline-block text-sm font-bold text-[var(--color-primary)]"\n                          >\n                            View overall & league stats →\n                          </Link>''',
              '''                          <Link\n                            href={`/players/${encodeURIComponent(player.playerId)}`}\n                            className="group inline-flex items-center gap-2"\n                          >\n                            <h3 className="text-xl font-black group-hover:text-[var(--color-primary)]">{player.displayName}</h3>\n                            <span aria-hidden="true" className="transition group-hover:translate-x-1">→</span>\n                          </Link>\n                          <div className="mt-1 text-sm text-[var(--color-text-muted)]">Click the player name for profile, league history, and statistics.</div>''',
          )

          # Check-in: player names open profiles, and the status tiles themselves filter.
          replace_once(
              "app/game-nights/check-in/page.tsx",
              '''                  <div className="rounded-xl bg-[var(--color-panel-soft)] px-3 py-2">\n                    <div className="text-lg font-black">{night.attendance.length}</div>\n                    <div className="text-xs text-[var(--color-text-muted)]">Roster</div>\n                  </div>\n                  <div className="rounded-xl bg-emerald-500/10 px-3 py-2">\n                    <div className="text-lg font-black text-emerald-200">{checkedInCount}</div>\n                    <div className="text-xs text-[var(--color-text-muted)]">Here</div>\n                  </div>\n                  <div className="rounded-xl bg-[var(--color-panel-soft)] px-3 py-2">\n                    <div className="text-lg font-black">{waitingCount}</div>\n                    <div className="text-xs text-[var(--color-text-muted)]">Still out</div>\n                  </div>\n                  <div className={`rounded-xl px-3 py-2 ${duesPendingCount ? "bg-amber-500/10" : "bg-[var(--color-panel-soft)]"}`}>\n                    <div className={`text-lg font-black ${duesPendingCount ? "text-amber-200" : ""}`}>\n                      {duesPendingCount}\n                    </div>\n                    <div className="text-xs text-[var(--color-text-muted)]">Dues pending</div>\n                  </div>''',
              '''                  <button type="button" onClick={() => setAttendanceFilter("all")} className="rounded-xl bg-[var(--color-panel-soft)] px-3 py-2 transition hover:ring-2 hover:ring-[var(--color-primary)]">\n                    <div className="text-lg font-black">{night.attendance.length}</div>\n                    <div className="text-xs text-[var(--color-text-muted)]">Roster</div>\n                  </button>\n                  <button type="button" onClick={() => setAttendanceFilter("checked_in")} className="rounded-xl bg-emerald-500/10 px-3 py-2 transition hover:ring-2 hover:ring-emerald-400">\n                    <div className="text-lg font-black text-emerald-200">{checkedInCount}</div>\n                    <div className="text-xs text-[var(--color-text-muted)]">Here</div>\n                  </button>\n                  <button type="button" onClick={() => setAttendanceFilter("waiting")} className="rounded-xl bg-[var(--color-panel-soft)] px-3 py-2 transition hover:ring-2 hover:ring-[var(--color-primary)]">\n                    <div className="text-lg font-black">{waitingCount}</div>\n                    <div className="text-xs text-[var(--color-text-muted)]">Still out</div>\n                  </button>\n                  <button type="button" onClick={() => setAttendanceFilter("dues")} className={`rounded-xl px-3 py-2 transition hover:ring-2 hover:ring-amber-400 ${duesPendingCount ? "bg-amber-500/10" : "bg-[var(--color-panel-soft)]"}`}>\n                    <div className={`text-lg font-black ${duesPendingCount ? "text-amber-200" : ""}`}>\n                      {duesPendingCount}\n                    </div>\n                    <div className="text-xs text-[var(--color-text-muted)]">Dues pending</div>\n                  </button>''',
          )
          replace_once(
              "app/game-nights/check-in/page.tsx",
              '''                          <div className="font-black">{player.displayName}</div>''',
              '''                          <Link href={`/players/${encodeURIComponent(player.playerId)}`} className="font-black hover:text-[var(--color-primary)] hover:underline">\n                            {player.displayName}\n                          </Link>''',
          )

          # Team views link every real player to their profile.
          replace_once(
              "app/game-nights/teams/page.tsx",
              '''                          {member.displayName}\n                          {member.isDummy ? " · dummy" : ""}''',
              '''                          {!member.isDummy && member.playerId ? (\n                            <Link href={`/players/${encodeURIComponent(member.playerId)}`} className="hover:text-[var(--color-primary)] hover:underline">\n                              {member.displayName}\n                            </Link>\n                          ) : (\n                            member.displayName\n                          )}\n                          {member.isDummy ? " · dummy" : ""}''',
          )
          replace_once(
              "app/game-nights/teams/page.tsx",
              '''                          <span className="flex flex-wrap items-center gap-2 font-black">\n                            {player.displayName}''',
              '''                          <span className="flex flex-wrap items-center gap-2 font-black">\n                            <Link href={`/players/${encodeURIComponent(player.playerId)}`} className="hover:text-[var(--color-primary)] hover:underline">\n                              {player.displayName}\n                            </Link>''',
          )

          # Stats carry the master player id without changing scoring semantics.
          replace_once(
              "lib/league/gameNightStats.ts",
              '''export type GameNightStatTurnInput = {\n  leaguePlayerId: string | null;''',
              '''export type GameNightStatTurnInput = {\n  playerId?: string | null;\n  leaguePlayerId: string | null;''',
          )
          replace_once(
              "lib/league/gameNightStats.ts",
              '''export type GameNightPlayerStats = {\n  leaguePlayerId: string;''',
              '''export type GameNightPlayerStats = {\n  playerId: string | null;\n  leaguePlayerId: string;''',
          )
          replace_once(
              "lib/league/gameNightStats.ts",
              '''  players: Array<{\n    leaguePlayerId: string;''',
              '''  players: Array<{\n    playerId: string | null;\n    leaguePlayerId: string;''',
          )
          replace_once(
              "lib/league/gameNightStats.ts",
              '''function emptyPlayer(\n  leaguePlayerId: string,\n  displayName: string,\n): GameNightPlayerStats {\n  return {\n    leaguePlayerId,''',
              '''function emptyPlayer(\n  leaguePlayerId: string,\n  displayName: string,\n  playerId: string | null,\n): GameNightPlayerStats {\n  return {\n    playerId,\n    leaguePlayerId,''',
          )
          replace_once(
              "lib/league/gameNightStats.ts",
              '''      .map((player) => ({\n        leaguePlayerId: player.leaguePlayerId,''',
              '''      .map((player) => ({\n        playerId: player.playerId,\n        leaguePlayerId: player.leaguePlayerId,''',
          )
          replace_once(
              "lib/league/gameNightStats.ts",
              '''      emptyPlayer(turn.leaguePlayerId, turn.displayName);\n    player.displayName = turn.displayName;''',
              '''      emptyPlayer(turn.leaguePlayerId, turn.displayName, turn.playerId ?? null);\n    player.displayName = turn.displayName;\n    if (turn.playerId) player.playerId = turn.playerId;''',
          )

          replace_once(
              "lib/db/repositories/gameNightStats.ts",
              '''import { gameNights } from "../game-night-schema";\nimport { leagueMatchSessions, leagueMatchTurns } from "../league-match-schema";''',
              '''import { gameNights } from "../game-night-schema";\nimport { leaguePlayers } from "../league-schema";\nimport { leagueMatchSessions, leagueMatchTurns } from "../league-match-schema";''',
          )
          replace_once(
              "lib/db/repositories/gameNightStats.ts",
              '''    .select({\n      leaguePlayerId: leagueMatchTurns.leaguePlayerId,''',
              '''    .select({\n      playerId: leaguePlayers.playerId,\n      leaguePlayerId: leagueMatchTurns.leaguePlayerId,''',
          )
          replace_once(
              "lib/db/repositories/gameNightStats.ts",
              '''    .innerJoin(\n      leagueMatchSessions,\n      eq(leagueMatchTurns.matchSessionId, leagueMatchSessions.id),\n    )\n    .where(eq(leagueMatchSessions.gameNightId, gameNightId));''',
              '''    .innerJoin(\n      leagueMatchSessions,\n      eq(leagueMatchTurns.matchSessionId, leagueMatchSessions.id),\n    )\n    .leftJoin(leaguePlayers, eq(leagueMatchTurns.leaguePlayerId, leaguePlayers.id))\n    .where(eq(leagueMatchSessions.gameNightId, gameNightId));''',
          )

          replace_once(
              "components/GameNightStatsPanel.tsx",
              '''import { useCallback, useEffect, useState } from "react";''',
              '''import Link from "next/link";\nimport { useCallback, useEffect, useState } from "react";''',
          )
          p = Path("components/GameNightStatsPanel.tsx")
          text = p.read_text()
          start = text.index('''function leaderNames(''')
          end = text.index('''\n\nexport function GameNightStatsPanel''', start)
          text = text[:start] + '''function LeaderNames({ leader }: { leader: GameNightStatsSummary["most180s"] }) {\n  if (!leader) return null;\n  return (\n    <>\n      {leader.players.map((player, index) => (\n        <span key={player.leaguePlayerId}>\n          {index > 0 ? ", " : ""}\n          {player.playerId ? (\n            <Link href={`/players/${encodeURIComponent(player.playerId)}`} className="hover:text-[var(--color-primary)] hover:underline">\n              {player.displayName}\n            </Link>\n          ) : (\n            player.displayName\n          )}\n        </span>\n      ))}\n    </>\n  );\n}''' + text[end:]
          text = text.replace('{leaderNames(stats.most180s)}', '<LeaderNames leader={stats.most180s} />')
          text = text.replace('{leaderNames(stats.highestTurn)}', '<LeaderNames leader={stats.highestTurn} />')
          text = text.replace('''                      <td className="py-3 pr-4 font-bold">\n                        {player.displayName}\n                      </td>''', '''                      <td className="py-3 pr-4 font-bold">\n                        {player.playerId ? (\n                          <Link href={`/players/${encodeURIComponent(player.playerId)}`} className="hover:text-[var(--color-primary)] hover:underline">\n                            {player.displayName}\n                          </Link>\n                        ) : (\n                          player.displayName\n                        )}\n                      </td>''')
          p.write_text(text)

          # Venue Hardware accepts contextual deep links and cross-links board <-> scorer.
          replace_once(
              "app/league-devices/page.tsx",
              '''import { FormEvent, useCallback, useEffect, useMemo, useState } from "react";''',
              '''import { FormEvent, useCallback, useEffect, useMemo, useRef, useState } from "react";''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''  const [statusMessage, setStatusMessage] = useState("");''',
              '''  const [statusMessage, setStatusMessage] = useState("");\n  const [targetBoardId, setTargetBoardId] = useState("");\n  const [targetDeviceId, setTargetDeviceId] = useState("");\n  const deepLinkAppliedRef = useRef(false);''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''    setLeagues(result.leagues);\n    setLeagueId((current) => current || result.leagues[0]?.id || "");''',
              '''    setLeagues(result.leagues);\n    const requestedLeagueId = new URLSearchParams(window.location.search).get("leagueId");\n    setLeagueId((current) =>\n      current ||\n      (requestedLeagueId && result.leagues.some((league) => league.id === requestedLeagueId)\n        ? requestedLeagueId\n        : result.leagues[0]?.id || ""),\n    );''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''  useEffect(() => {\n    if (!session?.user) return;\n    const timer = window.setTimeout(() => {\n      void loadLeagues().catch((error) =>''',
              '''  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n    setTargetBoardId(params.get("boardId") ?? "");\n    setTargetDeviceId(params.get("deviceId") ?? "");\n  }, []);\n\n  useEffect(() => {\n    if (!session?.user) return;\n    const timer = window.setTimeout(() => {\n      void loadLeagues().catch((error) =>''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''  useEffect(() => {\n    if (!leagueId) return;\n    const timer = window.setTimeout(() => {\n      void loadHardware(leagueId).catch((error) =>''',
              '''  useEffect(() => {\n    if (!leagueId) return;\n    const requestedVenueId = !deepLinkAppliedRef.current\n      ? new URLSearchParams(window.location.search).get("venueId") ?? undefined\n      : undefined;\n    deepLinkAppliedRef.current = true;\n    const timer = window.setTimeout(() => {\n      void loadHardware(leagueId, requestedVenueId).catch((error) =>''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''  function clearNotices() {''',
              '''  useEffect(() => {\n    const targetId = targetDeviceId\n      ? `device-${targetDeviceId}`\n      : targetBoardId\n        ? `board-${targetBoardId}`\n        : "";\n    if (!targetId) return;\n    const timer = window.setTimeout(() => {\n      document.getElementById(targetId)?.scrollIntoView({ behavior: "smooth", block: "center" });\n    }, 120);\n    return () => window.clearTimeout(timer);\n  }, [boards, devices, targetBoardId, targetDeviceId]);\n\n  function clearNotices() {''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''                  <article key={board.id} className="rounded-xl border border-[var(--color-panel-border)] p-4">''',
              '''                  <article\n                    id={`board-${board.id}`}\n                    key={board.id}\n                    className={`scroll-mt-6 rounded-xl border p-4 transition ${\n                      targetBoardId === board.id\n                        ? "border-[var(--color-primary)] bg-blue-500/10 ring-2 ring-[var(--color-primary)]/40"\n                        : "border-[var(--color-panel-border)]"\n                    }`}\n                  >''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''                    {scorer && <div className="mt-2 text-xs text-[var(--color-text-muted)]">{scorer.status === "active" ? "Enabled" : "Disabled"} · {seenLabel(scorer.lastSeenAt)}{savingDeviceIds.has(scorer.id) ? " · Saving…" : ""}</div>}''',
              '''                    {scorer && (\n                      <div className="mt-2 text-xs text-[var(--color-text-muted)]">\n                        Scorer:{" "}\n                        <Link\n                          href={`/league-devices?leagueId=${encodeURIComponent(leagueId)}&venueId=${encodeURIComponent(venueId)}&deviceId=${encodeURIComponent(scorer.id)}`}\n                          className="font-black hover:text-[var(--color-primary)] hover:underline"\n                        >\n                          {scorer.name}\n                        </Link>{" "}\n                        · {scorer.status === "active" ? "Enabled" : "Disabled"} · {seenLabel(scorer.lastSeenAt)}{savingDeviceIds.has(scorer.id) ? " · Saving…" : ""}\n                      </div>\n                    )}''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''                  <article key={device.id} className="rounded-xl border border-[var(--color-panel-border)] p-4">''',
              '''                  <article\n                    id={`device-${device.id}`}\n                    key={device.id}\n                    className={`scroll-mt-6 rounded-xl border p-4 transition ${\n                      targetDeviceId === device.id\n                        ? "border-[var(--color-primary)] bg-blue-500/10 ring-2 ring-[var(--color-primary)]/40"\n                        : "border-[var(--color-panel-border)]"\n                    }`}\n                  >''',
          )
          replace_once(
              "app/league-devices/page.tsx",
              '''                        <div className="mt-1 text-xs text-[var(--color-text-muted)]">{device.boardName ?? "Spare / unassigned"} · {seenLabel(device.lastSeenAt)}</div>''',
              '''                        <div className="mt-1 text-xs text-[var(--color-text-muted)]">\n                          {device.physicalBoardId && device.boardName ? (\n                            <Link\n                              href={`/league-devices?leagueId=${encodeURIComponent(leagueId)}&venueId=${encodeURIComponent(venueId)}&boardId=${encodeURIComponent(device.physicalBoardId)}`}\n                              className="font-bold hover:text-[var(--color-primary)] hover:underline"\n                            >\n                              {device.boardName}\n                            </Link>\n                          ) : (\n                            "Spare / unassigned"\n                          )}{" "}\n                          · {seenLabel(device.lastSeenAt)}\n                        </div>''',
          )

          # Live board health: board name/status opens current match (when one exists),
          # while scorer health opens the exact scorer record.
          replace_once(
              "components/GameNightBoardOperationsPanel.tsx",
              '''"use client";\n\nimport { useCallback, useEffect, useMemo, useState } from "react";''',
              '''"use client";\n\nimport Link from "next/link";\nimport { useCallback, useEffect, useMemo, useState } from "react";''',
          )
          replace_once(
              "components/GameNightBoardOperationsPanel.tsx",
              '''          const moveKey = `move:${nightBoard.id}`;\n          const deviceKey = `device:${physical?.id ?? nightBoard.id}`;''',
              '''          const moveKey = `move:${nightBoard.id}`;\n          const deviceKey = `device:${physical?.id ?? nightBoard.id}`;\n          const currentRoundNumber = night.activeRoundNumber ?? night.currentRoundNumber ?? 1;\n          const currentPairing =\n            night.pairings.find(\n              (pairing) => pairing.boardId === nightBoard.id && pairing.matchStatus === "active",\n            ) ??\n            night.pairings.find(\n              (pairing) =>\n                pairing.boardId === nightBoard.id &&\n                pairing.roundNumber === currentRoundNumber &&\n                pairing.matchStatus !== "completed",\n            ) ??\n            null;\n          const boardDetailsHref = physical\n            ? `/league-devices?leagueId=${encodeURIComponent(leagueId)}&venueId=${encodeURIComponent(night.venueId ?? "")}&boardId=${encodeURIComponent(physical.id)}`\n            : "/league-devices";\n          const boardPrimaryHref = currentPairing?.matchSessionId\n            ? `/league-match/${encodeURIComponent(currentPairing.matchSessionId)}`\n            : boardDetailsHref;\n          const deviceDetailsHref = scorer\n            ? `/league-devices?leagueId=${encodeURIComponent(leagueId)}&venueId=${encodeURIComponent(night.venueId ?? "")}&deviceId=${encodeURIComponent(scorer.id)}`\n            : boardDetailsHref;''',
          )
          replace_once(
              "components/GameNightBoardOperationsPanel.tsx",
              '''                  <div className="text-lg font-black">{physical?.name ?? nightBoard.name}</div>\n                  <div className="mt-1 text-xs text-[var(--color-text-muted)]">''',
              '''                  <Link href={boardPrimaryHref} className="group inline-flex items-center gap-2 text-lg font-black hover:text-[var(--color-primary)]">\n                    {physical?.name ?? nightBoard.name}\n                    <span aria-hidden="true" className="transition group-hover:translate-x-1">→</span>\n                  </Link>\n                  <div className="mt-1 text-xs text-[var(--color-text-muted)]">''',
          )
          replace_once(
              "components/GameNightBoardOperationsPanel.tsx",
              '''                  <span className={`rounded-full border px-2.5 py-1 text-xs font-black ${\n                    physical?.status === "active" ? toneClasses("green") : toneClasses("red")\n                  }`}>\n                    {physical?.status === "active" ? "Board available" : "Board out of service"}\n                  </span>\n                  <span className={`rounded-full border px-2.5 py-1 text-xs font-black ${toneClasses(health.tone)}`}>\n                    {health.label}\n                  </span>''',
              '''                  <Link href={boardDetailsHref} className={`rounded-full border px-2.5 py-1 text-xs font-black transition hover:ring-2 ${\n                    physical?.status === "active" ? toneClasses("green") : toneClasses("red")\n                  }`}>\n                    {physical?.status === "active" ? "Board available" : "Board out of service"}\n                  </Link>\n                  <Link href={deviceDetailsHref} className={`rounded-full border px-2.5 py-1 text-xs font-black transition hover:ring-2 ${toneClasses(health.tone)}`}>\n                    {scorer ? `${scorer.name} · ${health.label}` : health.label}\n                  </Link>''',
          )

          # Control Room references become navigable entities.
          replace_once(
              "app/game-nights/control/page.tsx",
              '''              {workspace.league?.name} · {night.seasonName} · {formatDate(night.scheduledAt)}''',
              '''              <Link href="/leagues" className="font-bold hover:text-[var(--color-primary)] hover:underline">{workspace.league?.name}</Link> ·{" "}\n              <Link href="/leagues" className="font-bold hover:text-[var(--color-primary)] hover:underline">{night.seasonName}</Link> · {formatDate(night.scheduledAt)}''',
          )
          replace_once(
              "app/game-nights/control/page.tsx",
              '''                {night.venueName}\n              </p>''',
              '''                <Link\n                  href={`/league-devices?leagueId=${encodeURIComponent(workspace.leagueId)}&venueId=${encodeURIComponent(night.venueId ?? "")}`}\n                  className="hover:text-[var(--color-primary)] hover:underline"\n                >\n                  {night.venueName} →\n                </Link>\n              </p>''',
          )
          replace_once(
              "app/game-nights/control/page.tsx",
              '''                        <h3 className="font-black">\n                          {board?.name ?? `Board ${pairing.boardNumber}`}\n                        </h3>''',
              '''                        <h3 className="font-black">\n                          {pairing.matchSessionId ? (\n                            <Link href={`/league-match/${pairing.matchSessionId}`} className="hover:text-[var(--color-primary)] hover:underline">\n                              {board?.name ?? `Board ${pairing.boardNumber}`} →\n                            </Link>\n                          ) : board?.physicalBoardId && night.venueId ? (\n                            <Link\n                              href={`/league-devices?leagueId=${encodeURIComponent(workspace.leagueId)}&venueId=${encodeURIComponent(night.venueId)}&boardId=${encodeURIComponent(board.physicalBoardId)}`}\n                              className="hover:text-[var(--color-primary)] hover:underline"\n                            >\n                              {board.name} →\n                            </Link>\n                          ) : (\n                            board?.name ?? `Board ${pairing.boardNumber}`\n                          )}\n                        </h3>''',
          )
          replace_once(
              "app/game-nights/control/page.tsx",
              '''                        <div className="font-black">{teamA?.name ?? "Team A"}</div>\n                        <div className="text-xs font-black uppercase text-[var(--color-text-muted)]">vs</div>\n                        <div className="font-black">{teamB?.name ?? "Team B"}</div>''',
              '''                        <Link href="/game-nights/teams" className="font-black hover:text-[var(--color-primary)] hover:underline">{teamA?.name ?? "Team A"}</Link>\n                        <div className="text-xs font-black uppercase text-[var(--color-text-muted)]">vs</div>\n                        <Link href="/game-nights/teams" className="font-black hover:text-[var(--color-primary)] hover:underline">{teamB?.name ?? "Team B"}</Link>''',
          )

          # Version metadata.
          replace_once("lib/appInfo.ts", 'version: "0.5.0-alpha.16"', 'version: "0.5.0-alpha.17"')
          PY
          npm version 0.5.0-alpha.17 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npm run db:migrate

      - name: Run relevant contracts
        run: |
          npm run db:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:stats:test
          npm run game-night:board-ops:test
          npm run board-device:test
          npm run venue-hardware:test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit validated alpha.17
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib package.json package-lock.json
          git commit -m "Add entity drill-down navigation for alpha.17"
          git push
