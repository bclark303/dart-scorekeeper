name: Alpha 13 archived venue guard

"on":
  push:
    branches:
      - internal/alpha13-venue-administration

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal/alpha13-venue-administration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply archived-only venue guard and contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/db/repositories/venueHardware.ts')
          text = path.read_text()
          old = '''  const existing = (await listVenuesForLeagueForUser(input.leagueId, input.userId)).find(
            (venue) => venue.status === "active",
          ) ?? null;
          if (existing) return existing;

          const [league] = await getDatabase()'''
          new = '''  const linkedVenues = await listVenuesForLeagueForUser(input.leagueId, input.userId);
          const existing = linkedVenues.find((venue) => venue.status === "active") ?? null;
          if (existing) return existing;
          if (linkedVenues.length) {
            throw new Error(
              "This league does not have an active venue. Restore or create a venue before scheduling a Game Night.",
            );
          }

          const [league] = await getDatabase()'''
          if old not in text:
            raise SystemExit('ensureDefaultVenue guard target not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('scripts/venue-hardware-contract-test.ts')
          text = path.read_text()
          marker = '''  const hardwareA = await getVenueHardwareForUser({
            leagueId: leagueA.leagueId,
            userId: ownerUserId,
          });'''
          insertion = '''  // Archiving the only venue is an intentional administrative state. A later
          // Game Night must not silently invent a replacement venue.
          const leagueC = await createLeagueWithTwoPlayers({
            suffix,
            label: "charlie",
            ownerUserId,
            nowOffset: 1_250,
          });
          const hardwareC = await getVenueHardwareForUser({
            leagueId: leagueC.leagueId,
            userId: ownerUserId,
          });
          assert.ok(hardwareC.venue, "League C should start with a default venue.");
          await updateVenueForUser({
            venueId: hardwareC.venue.id,
            userId: ownerUserId,
            status: "archived",
            now: BASE_NOW + 1_300,
          });
          await assert.rejects(
            () => createGameNightForUser({
              id: `archived-only-night-${suffix}`,
              leagueId: leagueC.leagueId,
              seasonId: leagueC.seasonId,
              userId: ownerUserId,
              name: "Archived Only Venue Night",
              scheduledAt: BASE_NOW + 250_000,
              settings: { ...DEFAULT_GAME_NIGHT_SETTINGS, boardCount: 1 },
              now: BASE_NOW + 1_350,
            }),
            /does not have an active venue/i,
            "Game Night creation must require an explicit restore/create when all linked venues are archived.",
          );

          const hardwareA = await getVenueHardwareForUser({
            leagueId: leagueA.leagueId,
            userId: ownerUserId,
          });'''
          if marker not in text:
            raise SystemExit('venue contract insertion target not found')
          path.write_text(text.replace(marker, insertion, 1))
      - run: npm ci
      - run: |
          mkdir -p data
          npm run db:migrate
      - name: Validate final guard
        run: |
          npm run venue-hardware:test
          npm run game-night:test
          npm run lint
          npm run build
      - name: Commit final guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/db/repositories/venueHardware.ts scripts/venue-hardware-contract-test.ts
          git commit -m "Require explicit active venue after archival"
          git push origin HEAD:internal/alpha13-venue-administration
