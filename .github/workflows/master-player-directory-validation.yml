name: Master player directory validation

on:
  push:
    branches:
      - internal/master-player-directory

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p data
      - name: Migration drift
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git status --porcelain -- drizzle/)"
      - run: npm run db:migrate
      - name: Cross-league master player contract
        run: |
          cat > .tmp-player-directory-contract.ts <<'EOF'
          import assert from "node:assert/strict";
          import { addExistingPlayerToLeagueForUser, addLeaguePlayerToSeasonForUser, createLeagueForUser, createLeaguePlayerForUser, listPlayerDirectoryForUser } from "@/lib/db";
          const suffix = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
          const userId = `directory-user-${suffix}`;
          const playerId = `directory-player-${suffix}`;
          const leagueA = `directory-league-a-${suffix}`;
          const leagueB = `directory-league-b-${suffix}`;
          const seasonA = `directory-season-a-${suffix}`;
          const seasonB = `directory-season-b-${suffix}`;
          const memberA = `directory-member-a-${suffix}`;
          const memberB = `directory-member-b-${suffix}`;
          await createLeagueForUser({ id: leagueA, membershipId: `admin-a-${suffix}`, userId, name: "League A", firstSeason: { id: seasonA, name: "Season A" } });
          await createLeagueForUser({ id: leagueB, membershipId: `admin-b-${suffix}`, userId, name: "League B", firstSeason: { id: seasonB, name: "Season B" } });
          await createLeaguePlayerForUser({ playerId, leaguePlayerId: memberA, leagueId: leagueA, userId, displayName: "Shared Player" });
          const added = await addExistingPlayerToLeagueForUser({ playerId, leaguePlayerId: memberB, leagueId: leagueB, userId });
          assert.equal(added.playerId, playerId);
          await addLeaguePlayerToSeasonForUser({ rosterEntryId: `roster-a-${suffix}`, leagueId: leagueA, seasonId: seasonA, leaguePlayerId: memberA, userId });
          await addLeaguePlayerToSeasonForUser({ rosterEntryId: `roster-b-${suffix}`, leagueId: leagueB, seasonId: seasonB, leaguePlayerId: memberB, userId });
          const directory = await listPlayerDirectoryForUser(userId);
          const matches = directory.filter((player) => player.playerId === playerId);
          assert.equal(matches.length, 1);
          assert.equal(matches[0]?.memberships.length, 2);
          assert.deepEqual(matches[0]?.memberships.map((membership) => membership.leagueId).sort(), [leagueA, leagueB].sort());
          assert.deepEqual(matches[0]?.memberships.find((membership) => membership.leagueId === leagueA)?.seasonIds, [seasonA]);
          assert.deepEqual(matches[0]?.memberships.find((membership) => membership.leagueId === leagueB)?.seasonIds, [seasonB]);
          const repeated = await addExistingPlayerToLeagueForUser({ playerId, leaguePlayerId: `unused-${suffix}`, leagueId: leagueB, userId });
          assert.equal(repeated.id, memberB);
          console.log("Cross-league master player contract passed.");
          EOF
          npx tsx .tmp-player-directory-contract.ts
          rm .tmp-player-directory-contract.ts
      - name: Full contract suite
        run: |
          npm run db:test
          npm run local:test
          npm run auth:test
          npm run setup:test
          npm run x01:test
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test
          npm run board-device:test
          npm run board-device:offline:test
          npm run board-device:pairing:test
      - run: npm run lint
      - run: npm run build
      - run: docker build -t dart-scorekeeper-player-directory .
