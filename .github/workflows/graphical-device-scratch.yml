name: Graphical device scoring scratch verification

on:
  push:
    branches:
      - internal/graphical-device-scoring

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/graphical-device-scratch-ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: internal/graphical-device-scoring

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply graphical device scoring patch
        run: node scripts/apply-graphical-device-scoring.mjs

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Generate graphical dart migration
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate

      - name: Exercise database repository contract
        run: npm run db:test

      - name: Exercise browser archive queue contract
        run: npm run local:test

      - name: Exercise authentication and sync ownership contract
        run: npm run auth:test

      - name: Exercise self-hosted database setup contract
        run: npm run setup:test

      - name: Exercise league framework contract
        run: npm run league:test

      - name: Exercise league player and roster contract
        run: npm run league:roster:test

      - name: Exercise game-night lifecycle contract
        run: npm run game-night:test

      - name: Exercise central league match contract
        run: npm run league-match:test

      - name: Exercise registered board device graphical scoring contract
        run: npm run board-device:test

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-graphical-device-scratch .

      - name: Commit validated feature and migration artifacts
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            components/DartEntry.tsx \
            components/LeagueMatchScorer.tsx \
            lib/league/matchContracts.ts \
            lib/db/league-match-schema.ts \
            lib/db/repositories/leagueMatches.ts \
            lib/db/repositories/boardDevices.ts \
            app/api/league-matches/route.ts \
            app/api/board-device/route.ts \
            scripts/board-device-contract-test.ts \
            drizzle/
          if ! git diff --cached --quiet; then
            git commit -m "Add graphical scoring to registered board devices"
            git push
          fi
