name: Materialize v0.5 league round model

on:
  push:
    branches:
      - agent/v05-league-round-model
    paths:
      - scripts/materialize-v05-round-model.mjs

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize source changes
        run: node scripts/materialize-v05-round-model.mjs
      - name: Focused league model contract
        run: npx tsx scripts/v05-league-round-model-contract-test.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize board-constrained league round model"
          git push
