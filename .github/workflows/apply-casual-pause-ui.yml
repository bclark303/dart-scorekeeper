name: Apply casual pause and scoring view update

on:
  push:
    branches:
      - agent/casual-pause-exit-scoring-view
    paths:
      - .github/workflows/apply-casual-pause-ui.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/casual-pause-exit-scoring-view

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source changes
        run: python scripts/fix-and-apply-casual-pause-ui.py

      - name: Refresh lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Verify Drizzle migrations are committed
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git status --porcelain -- drizzle/)"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Core persistence contracts
        run: |
          npm run db:test
          npm run local:test
          npm run casual-saves:test
          npm run auth:test
          npm run setup:test
          npm run x01:test

      - name: League and game-night contracts
        run: |
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:readiness:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test

      - name: Device and venue contracts
        run: |
          npm run board-device:test
          npm run board-device:offline:test
          npm run board-device:pairing:test
          npm run venue-hardware:test
          npm run game-night:board-ops:test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-casual-pause .

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/casual/page.tsx components/DartEntry.tsx components/GameSetup.tsx CHANGELOG.md .github/workflows/portable-persistence.yml package-lock.json
          git commit -m "Add casual pause discard and Scoring View controls"
          git push origin HEAD:agent/casual-pause-exit-scoring-view
