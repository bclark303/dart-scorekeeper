name: Bootstrap DB contract tests

on:
  push:
    branches:
      - agent/db-contract-tests

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/bootstrap-contract.db
      DATABASE_AUTH_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfile
        run: npm install

      - name: Prepare database
        run: |
          mkdir -p data
          npm run db:migrate

      - name: Exercise repository contract
        run: npm run db:test

      - name: Remove one-time bootstrap workflow
        run: git rm .github/workflows/bootstrap-db-contract-tests.yml

      - name: Commit generated lockfile
        run: |
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock DB contract test dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
