name: Alpha 15 operator UX patch

"on":
  push:
    branches:
      - internal/alpha15-operator-ux

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal/alpha15-operator-ux

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire walk-up admin and scorer UX
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          # Make Control the authoritative pre-play home instead of duplicating a
          # loose collection of summary cards and priority rules in the page.
          path = Path('app/game-nights/control/page.tsx')
          text = path.read_text()
          import_line = 'import { GameNightBoardOperationsPanel } from "@/components/GameNightBoardOperationsPanel";\n'
          if 'GameNightReadinessPanel' not in text:
              text = text.replace(import_line, import_line + 'import { GameNightReadinessPanel } from "@/components/GameNightReadinessPanel";\n')

          stats_start = text.index('  const checkedIn = night.attendance.filter(')
          return_start = text.index('  return (', stats_start)
          live_stats = '''  const prePlay = ["draft", "checkin", "ready"].includes(night.status);
          const roundNumber = night.activeRoundNumber ?? night.currentRoundNumber ?? 1;
          const round =
            night.rounds?.find((item) => item.status === "active") ??
            night.rounds?.find((item) => item.roundNumber === roundNumber);
          const pairings =
            round?.pairings ??
            night.pairings.filter((item) => item.roundNumber === roundNumber);
          const completed = pairings.filter(
            (item) => item.matchStatus === "completed",
          ).length;
          const live = pairings.filter((item) => item.matchStatus === "active").length;
          const waiting = Math.max(0, pairings.length - completed - live);

'''
          text = text[:stats_start] + live_stats + text[return_start:]

          preplay_start_marker = '        {prePlay ? (\n          <>'
          preplay_end_marker = '          </>\n        ) : night.status === "active" ? ('
          preplay_start = text.index(preplay_start_marker)
          preplay_end = text.index(preplay_end_marker, preplay_start)
          replacement = '''        {prePlay ? (
          <GameNightReadinessPanel
            night={night}
            working={working}
            onStart={() => void changeStatus("active")}
          />
        ) : night.status === "active" ? ('''
          text = text[:preplay_start] + replacement + text[preplay_end + len(preplay_end_marker):]
          path.write_text(text)

          # A paired board device should explain its current job, not ask the
          # person at the dartboard to understand league/device operating modes.
          path = Path('app/board-device/page.tsx')
          text = path.read_text()
          select_start = text.find('  function selectLeagueMode() {')
          if select_start != -1:
              select_end = text.index('\n  function openCasualScorer()', select_start)
              text = text[:select_start] + text[select_end:]

          home_start_marker = '  return (\n    <main className="mx-auto max-w-5xl p-4 sm:p-6">'
          home_start = text.index(home_start_marker, text.index('if (openLeagueAssignment'))
          final_end = text.rindex('\n  );\n}')
          device_home = '''  const device = connection?.device ?? null;
          const assignment = connection?.assignment ?? null;
          const isSpare = Boolean(device && !device.physicalBoardId);

          return (
            <main className="flex min-h-screen items-center justify-center bg-[var(--color-app-bg)] p-4 text-[var(--color-text-main)] sm:p-6">
              <section className="w-full max-w-4xl overflow-hidden rounded-3xl border border-[var(--color-panel-border)] bg-[var(--color-panel)] shadow-xl">
                <div className="p-6 sm:p-8">
                  <div className="flex flex-wrap items-start justify-between gap-4">
                    <div>
                      <div className="text-xs font-black uppercase tracking-[0.16em] text-[var(--color-primary)]">
                        Scoring Device
                      </div>
                      <h1 className="mt-2 text-3xl font-black sm:text-4xl">
                        {device?.boardName ?? (isSpare ? "Spare scorer" : device?.name ?? "Connecting…")}
                      </h1>
                      {device && (
                        <p className="mt-2 text-sm text-[var(--color-text-muted)]">
                          {device.venueName} · {device.name}
                        </p>
                      )}
                    </div>
                    <span className={`rounded-full border px-3 py-1 text-xs font-black uppercase tracking-wide ${
                      device
                        ? "border-emerald-500/40 bg-emerald-500/10 text-emerald-200"
                        : "border-amber-500/40 bg-amber-500/10 text-amber-100"
                    }`}>
                      {device ? "Connected" : "Connecting"}
                    </span>
                  </div>

                  {errorMessage && (
                    <div className="mt-5 rounded-xl border border-red-500/40 bg-red-500/10 p-4 text-sm text-red-100">
                      <strong>Connection needs attention.</strong> {errorMessage}
                    </div>
                  )}

                  <div className="mt-7 rounded-3xl border border-[var(--color-panel-border)] bg-[var(--color-panel-soft)] p-6 text-center sm:p-8">
                    <div className="text-5xl" aria-hidden="true">
                      {isSpare ? "🧰" : assignment ? "🎯" : "⏳"}
                    </div>
                    <h2 className="mt-4 text-2xl font-black sm:text-3xl">
                      {isSpare
                        ? "This scorer is a spare"
                        : assignment
                          ? assignment.gameNightStatus === "active"
                            ? "Waiting for the next board match"
                            : `Ready for ${assignment.gameNightName}`
                          : device?.physicalBoardId
                            ? "Waiting for a league match"
                            : "Checking this scorer's assignment"}
                    </h2>
                    <p className="mx-auto mt-3 max-w-2xl text-sm leading-6 text-[var(--color-text-muted)] sm:text-base">
                      {isSpare
                        ? "Nothing needs to be done here. An administrator can move this scorer onto any physical board that needs a replacement."
                        : assignment
                          ? assignment.gameNightStatus === "active"
                            ? `${assignment.gameNightName} is active. This screen will open scoring automatically as soon as ${assignment.boardName} has a match ready.`
                            : `${assignment.gameNightName} is prepared for ${assignment.boardName}. Leave this screen open; scoring will appear automatically when the administrator starts play.`
                          : device?.physicalBoardId
                            ? `This device is assigned to ${device.boardName ?? "a physical board"}. Leave it here; it checks for league assignments automatically.`
                            : "The scorer is reconnecting to its registered device record."}
                    </p>

                    {assignment && (
                      <div className="mx-auto mt-5 max-w-xl rounded-2xl border border-[var(--color-panel-border)] bg-[var(--color-panel)] p-4 text-left">
                        <div className="text-xs font-black uppercase tracking-wide text-[var(--color-text-muted)]">Next assignment</div>
                        <div className="mt-1 font-black">{assignment.gameNightName} · {assignment.boardName}</div>
                        {assignment.teamAName && assignment.teamBName && (
                          <div className="mt-1 text-sm text-[var(--color-text-muted)]">
                            {assignment.teamAName} vs {assignment.teamBName}
                          </div>
                        )}
                      </div>
                    )}

                    <button
                      type="button"
                      onClick={() => void loadConnection()}
                      disabled={loading}
                      className="mt-6 min-h-12 rounded-xl border border-[var(--color-panel-border)] bg-[var(--color-panel)] px-5 py-3 font-black disabled:opacity-50"
                    >
                      {loading ? "Checking…" : "Check now"}
                    </button>
                    <div className="mt-2 text-xs text-[var(--color-text-muted)]">Checks automatically every five seconds.</div>
                  </div>
                </div>

                <div className="border-t border-[var(--color-panel-border)] bg-[var(--color-panel-soft)] p-5 sm:p-6">
                  <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <div>
                      <div className="font-black">Need something other than tonight's league match?</div>
                      <div className="mt-1 text-sm text-[var(--color-text-muted)]">
                        Casual scoring does not change this scorer's registered venue or board.
                      </div>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        type="button"
                        onClick={openCasualScorer}
                        className="rounded-xl border border-[var(--color-panel-border)] px-4 py-2.5 text-sm font-black"
                      >
                        Start Casual Game
                      </button>
                      <a href="/help?from=device" className="rounded-xl border border-[var(--color-panel-border)] px-4 py-2.5 text-sm font-black">Help</a>
                      <details className="relative">
                        <summary className="cursor-pointer list-none rounded-xl border border-[var(--color-panel-border)] px-4 py-2.5 text-sm font-black">
                          Device options
                        </summary>
                        <div className="absolute bottom-12 right-0 z-20 w-64 rounded-xl border border-[var(--color-panel-border)] bg-[var(--color-panel)] p-3 shadow-xl">
                          <button
                            type="button"
                            onClick={() => void forgetRegistration()}
                            className="w-full rounded-lg border border-red-500/40 px-3 py-2 text-left text-sm font-bold text-red-200"
                          >
                            Forget Registration
                          </button>
                        </div>
                      </details>
                    </div>
                  </div>
                </div>
              </section>
            </main>
          );
          }'''
          text = text[:home_start] + device_home + text[final_end + len('\n  );\n}'):]
          path.write_text(text)

          # The general home screen gets an unmistakable scorer entry point.
          path = Path('app/page.tsx')
          text = path.read_text()
          text = text.replace(
              'Pick a mode. Casual play stays entirely local; League Play opens\n                the connected league workflow.',
              'Choose what this screen is being used for. Casual and league administration stay separate from the dedicated scoring-device experience.',
          )
          grid_close = '''            </div>
          </div>
        </section>'''
          scorer_strip = '''            </div>

            <div className="mx-auto mt-5 flex max-w-4xl flex-col gap-3 rounded-2xl border border-violet-500/35 bg-[var(--color-panel)] p-4 sm:flex-row sm:items-center sm:justify-between">
              <div>
                <div className="font-black">Is this screen mounted at a dartboard?</div>
                <div className="mt-1 text-sm text-[var(--color-text-muted)]">Open the dedicated scorer. Once paired, it remembers its board and automatically follows league assignments.</div>
              </div>
              <Link href="/board-device" className="inline-flex min-h-12 shrink-0 items-center justify-center rounded-xl bg-violet-600 px-5 py-3 font-black text-white">
                Open Scoring Device →
              </Link>
            </div>
          </div>
        </section>'''
          if 'Is this screen mounted at a dartboard?' not in text:
              text = text.replace(grid_close, scorer_strip)
          path.write_text(text)

          # League Play becomes an admin-terminal landing page. Running tonight
          # is the obvious primary action; configuration tools sit underneath.
          path = Path('app/league-play/page.tsx')
          text = path.read_text()
          menu_start = text.index('const leagueMenu = [')
          menu_end = text.index('] as const;', menu_start) + len('] as const;')
          menu = '''const leagueMenu = [
            { href: "/leagues", title: "League Setup", description: "Leagues, seasons, rules, schedule, and league-level statistics.", icon: "🏛️" },
            { href: "/league-roster", title: "Players", description: "Add and manage players, league membership, and player statistics.", icon: "👥" },
            { href: "/league-devices", title: "Venue Hardware", description: "Venues, physical boards, scoring devices, pairing, and maintenance.", icon: "🖥️" },
            { href: "/league-play/play", title: "Match View", description: "Open the current centrally managed match when you need a direct match-level view.", icon: "🎯" },
          ] as const;'''
          text = text[:menu_start] + menu + text[menu_end:]
          text = text.replace('<h1 className="mt-2 text-4xl font-black">League Play</h1>', '<h1 className="mt-2 text-4xl font-black">League Admin</h1>')
          text = text.replace('Connected league scoring and administration.', 'The walk-up home for running a league night and maintaining the league.')
          active_end = '''            </section>

            {!leagues.length ? ('''
          admin_hero = '''            </section>

            {leagues.length > 0 && (
              <Link href="/game-nights/control" className="group mb-6 block rounded-3xl border border-blue-500/45 bg-blue-500/10 p-6 transition hover:border-blue-400 sm:p-7">
                <div className="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
                  <div>
                    <div className="text-xs font-black uppercase tracking-[0.16em] text-blue-300">Start here on league night</div>
                    <h2 className="mt-2 text-3xl font-black">Run Game Night</h2>
                    <p className="mt-2 max-w-2xl text-sm leading-6 text-[var(--color-text-muted)]">Control tells you exactly what is ready, what needs attention, and where to fix it. Once play starts, the same screen becomes the live operations dashboard.</p>
                  </div>
                  <div className="inline-flex min-h-14 shrink-0 items-center justify-center rounded-2xl bg-blue-600 px-6 py-4 text-lg font-black text-white">
                    Open Control <span className="ml-2 transition group-hover:translate-x-1">→</span>
                  </div>
                </div>
              </Link>
            )}

            {!leagues.length ? ('''
          if 'Start here on league night' not in text:
              text = text.replace(active_end, admin_hero)
          text = text.replace('<section className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">', '<><div className="mb-3 text-xs font-black uppercase tracking-[0.14em] text-[var(--color-text-muted)]">Administration & maintenance</div><section className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">')
          text = text.replace('              </section>\n            )}', '              </section></>\n            )}', 1)
          path.write_text(text)

          # Add the focused readiness contract to the normal npm script surface.
          path = Path('package.json')
          package = json.loads(path.read_text())
          scripts = package['scripts']
          if 'game-night:readiness:test' not in scripts:
              rebuilt = {}
              for key, value in scripts.items():
                  rebuilt[key] = value
                  if key == 'game-night:test':
                      rebuilt['game-night:readiness:test'] = 'tsx scripts/game-night-readiness-contract-test.ts'
              package['scripts'] = rebuilt
          path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - run: npm ci

      - name: Prepare database
        run: npm run db:migrate

      - name: Validate operator UX contracts
        run: |
          npm run game-night:readiness:test
          npm run game-night:test
          npm run venue-hardware:test
          npm run board-device:test
          npm run game-night:fixtures:test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit alpha.15 UX wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-nights/control/page.tsx app/board-device/page.tsx app/page.tsx app/league-play/page.tsx package.json
          if git diff --cached --quiet; then
            echo "No generated UX changes to commit."
          else
            git commit -m "Wire alpha.15 walk-up operator UX"
            git push origin HEAD:internal/alpha15-operator-ux
          fi
