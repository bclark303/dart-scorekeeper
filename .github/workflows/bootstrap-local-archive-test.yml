name: Bootstrap local archive test lockfile

on:
  push:
    branches:
      - agent/local-archive-queue

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh lockfile
        run: npm install

      - name: Exercise IndexedDB archive queue
        run: npm run local:test

      - name: Remove one-time workflow
        run: git rm .github/workflows/bootstrap-local-archive-test.yml

      - name: Commit lockfile
        run: |
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock local archive test dependency"
          git push origin HEAD:${GITHUB_REF_NAME}
