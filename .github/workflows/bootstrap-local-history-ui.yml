name: Bootstrap local history UI integration

on:
  push:
    branches:
      - agent/local-match-history

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wire archive history into History tab
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { CompletedLegs } from "@/components/CompletedLegs";\n',
              'import { CompletedLegs } from "@/components/CompletedLegs";\nimport { LocalMatchHistory } from "@/components/LocalMatchHistory";\n',
          )

          replace_once(
              '''        {activeView === "history" && (\n          <>\n            <TurnHistory turns={turnHistory} />\n            <CompletedLegs completedLegs={completedLegs} />\n          </>\n        )}''',
              '''        {activeView === "history" && (\n          <>\n            <LocalMatchHistory />\n            <TurnHistory turns={turnHistory} />\n            <CompletedLegs completedLegs={completedLegs} />\n          </>\n        )}''',
          )

          path.write_text(text)

      - name: Remove one-time workflow
        run: git rm .github/workflows/bootstrap-local-history-ui.yml

      - name: Commit integration
        run: |
          git add app/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Show completed archives in History tab"
          git push origin HEAD:${GITHUB_REF_NAME}
