name: Alpha 9 optimistic check-in candidate

on:
  push:
    branches:
      - internal/alpha8-checkin-optimistic

permissions:
  contents: write

jobs:
  prepare-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize alpha.9 version metadata
        run: |
          npm version 0.5.0-alpha.9 --no-git-tag-version
          sed -i 's/export const APP_VERSION = ".*";/export const APP_VERSION = "0.5.0-alpha.9";/' lib/appInfo.ts
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.version!=='0.5.0-alpha.9'||l.version!=='0.5.0-alpha.9'||l.packages[''].version!=='0.5.0-alpha.9') process.exit(1)"
          grep -F 'APP_VERSION = "0.5.0-alpha.9"' lib/appInfo.ts
      - run: npm ci
      - run: mkdir -p data
      - name: Verify Drizzle migrations are committed
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git status --porcelain -- drizzle/)"
      - run: npm run db:migrate
      - name: Run repository and game contracts
        run: |
          npm run db:test
          npm run local:test
          npm run auth:test
          npm run setup:test
          npm run x01:test
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test
          npm run board-device:test
          npm run board-device:offline:test
          npm run board-device:pairing:test
      - run: npm run lint
      - run: npm run build
      - run: docker build -t dart-scorekeeper-alpha9-optimistic-checkin .
      - name: Commit validated alpha.9 version metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json lib/appInfo.ts
          git diff --cached --exit-code && exit 0
          git commit -m "Prepare v0.5.0-alpha.9 candidate"
          git push origin HEAD:internal/alpha8-checkin-optimistic
