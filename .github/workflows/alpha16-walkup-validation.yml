name: Alpha 16 walk-up UX validation

"on":
  push:
    branches:
      - internal/alpha16-walkup-ux

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Core regression contracts
        run: |
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:readiness:test
          npm run venue-hardware:test
          npm run board-device:test
      - run: npm run lint
      - run: npm run build
