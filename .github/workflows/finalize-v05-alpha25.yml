name: Finalize v0.5.0-alpha.25

on:
  push:
    branches:
      - agent/v05-league-round-model
    paths:
      - scripts/finalize-v05-alpha25.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Finalize release metadata
        run: node scripts/finalize-v05-alpha25.mjs
      - name: Verify league round model
        run: npm run league:round-model:test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit alpha.25 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish v0.5.0-alpha.25 league round model"
          git push
