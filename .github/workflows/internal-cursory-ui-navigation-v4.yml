name: Internal cursory UI navigation preserved context check

on:
  push:
    branches:
      - internal/cursory-ui-navigation
    paths:
      - .github/workflows/internal-cursory-ui-navigation-v4.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      GAME_NIGHTS_LAYOUT_B64: 
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: internal/cursory-ui-navigation
          fetch-depth: 0

      - name: Restore contextual Game Night navigation
        run: |
          echo "$GAME_NIGHTS_LAYOUT_B64" | base64 -d > app/game-nights/layout.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migration drift and apply database
        run: |
          mkdir -p data
          npm run db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git status --porcelain -- drizzle/)"
          npm run db:migrate

      - name: Run regression contracts
        run: |
          npm run db:test
          npm run local:test
          npm run auth:test
          npm run setup:test
          npm run x01:test
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test
          npm run board-device:test
          npm run board-device:pairing:test
          npm run board-device:offline:test

      - name: Lint and production build
        run: |
          npm run lint
          npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-cursory-ui-context .

      - name: Commit clean scratch result
        run: |
          rm .github/workflows/internal-cursory-ui-navigation-v4.yml
          git config user.name "Ben Clark"
          git config user.email "bclark303@gmail.com"
          git add -A
          git commit -m "Preserve contextual Game Night navigation [skip ci]"
          git push origin HEAD:internal/cursory-ui-navigation
