name: Apply preview casual multiplayer X01

on:
  push:
    branches:
      - agent/casual-multiplayer-x01-preview

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out preview feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/casual-multiplayer-x01-preview

      - name: Apply source changes
        run: python3 scripts/apply-preview-casual-multiplayer-x01.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Verify migrations and initialize database
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git status --porcelain -- drizzle/)"
          npm run db:migrate

      - name: Run core contracts
        run: |
          npm run db:test
          npm run local:test
          npm run auth:test
          npm run setup:test
          npm run x01:test

      - name: Run league and game-night contracts
        run: |
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:readiness:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test

      - name: Run device and venue contracts
        run: |
          npm run board-device:test
          npm run board-device:offline:test
          npm run board-device:pairing:test
          npm run venue-hardware:test
          npm run game-night:board-ops:test

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Clean temporary patch machinery
        run: |
          rm scripts/apply-preview-casual-multiplayer-x01.py
          rm .github/workflows/apply-preview-casual-multiplayer-x01.yml

      - name: Commit validated preview feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add casual multiplayer and configurable X01 to preview"
          git push origin HEAD:agent/casual-multiplayer-x01-preview
