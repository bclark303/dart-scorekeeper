name: Game night scratch verification

on:
  pull_request:
    branches:
      - agent/league-rosters

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/game-night-scratch-ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: internal/game-night-gen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Generate game-night migration
        run: npm run db:generate

      - name: Commit generated migration artifacts
        run: |
          if ! git diff --quiet -- drizzle/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add drizzle/
            git commit -m "Generate game-night migration"
            git push
          fi

      - name: Apply migrations
        run: npm run db:migrate

      - name: Exercise database repository contract
        run: npm run db:test

      - name: Exercise browser archive queue contract
        run: npm run local:test

      - name: Exercise authentication and sync ownership contract
        run: npm run auth:test

      - name: Exercise self-hosted database setup contract
        run: npm run setup:test

      - name: Exercise league framework contract
        run: npm run league:test

      - name: Exercise league player and roster contract
        run: npm run league:roster:test

      - name: Exercise game-night lifecycle contract
        run: npm run game-night:test

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-game-night-scratch .
