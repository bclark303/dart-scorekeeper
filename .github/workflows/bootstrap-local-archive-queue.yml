name: Bootstrap local archive queue integration

on:
  push:
    branches:
      - agent/local-archive-queue

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wire completed matches into IndexedDB queue
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/page.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { createMatchId, createMatchIdentity } from "@/lib/persistence";',
              'import {\n'
              '  buildCompletedX01MatchArchive,\n'
              '  createMatchId,\n'
              '  createMatchIdentity,\n'
              '  queueLocalX01MatchArchive,\n'
              '} from "@/lib/persistence";',
          )

          marker = '''  ]);\n\n  function getDefaultTeamName(sideNumber: 1 | 2) {'''
          replacement = '''  ]);\n\n  // Completed matches are copied into a separate IndexedDB archive queue.\n  // Active scoring remains localStorage-driven and never waits for IndexedDB\n  // or a network request. The durable match ID makes repeated effect/load runs\n  // safe because queueLocalX01MatchArchive only stores each completed match once.\n  useEffect(() => {\n    if (!hasLoadedSavedMatch || !isMatchComplete || !matchId) {\n      return;\n    }\n\n    try {\n      const archive = buildCompletedX01MatchArchive({\n        matchId,\n        matchCreatedAt: matchCreatedAt ?? undefined,\n        startingScore,\n        finishRule,\n        bestOfLegs,\n        scoreEntryMode,\n        rotationMode,\n        dummyScore,\n        sides,\n        completedLegs,\n        isMatchComplete,\n      });\n\n      void queueLocalX01MatchArchive(archive).catch((error) => {\n        console.error("Could not queue completed match in IndexedDB.", error);\n      });\n    } catch (error) {\n      console.error("Could not build completed match archive.", error);\n    }\n  }, [\n    hasLoadedSavedMatch,\n    isMatchComplete,\n    matchId,\n    matchCreatedAt,\n    startingScore,\n    finishRule,\n    bestOfLegs,\n    scoreEntryMode,\n    rotationMode,\n    dummyScore,\n    sides,\n    completedLegs,\n  ]);\n\n  function getDefaultTeamName(sideNumber: 1 | 2) {'''
          replace_once(marker, replacement)

          path.write_text(text)

      - name: Remove one-time workflow
        run: git rm .github/workflows/bootstrap-local-archive-queue.yml

      - name: Commit integration
        run: |
          git add app/page.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Queue completed matches in local IndexedDB"
          git push origin HEAD:${GITHUB_REF_NAME}
