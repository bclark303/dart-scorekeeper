name: Bootstrap sync status UI copy

on:
  push:
    branches:
      - agent/auth-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/auth-sync

      - name: Refresh History on archive sync changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/LocalMatchHistory.tsx")
          text = path.read_text()

          old_import = '''import {
            listLocalX01MatchArchives,
            type LocalX01MatchArchiveRecord,
          } from "@/lib/persistence";'''
          new_import = '''import {
            listLocalX01MatchArchives,
            LOCAL_ARCHIVE_CHANGED_EVENT,
            type LocalX01MatchArchiveRecord,
          } from "@/lib/persistence";'''
          assert text.count(old_import) == 1, "History import marker changed"
          text = text.replace(old_import, new_import)

          old_effect = '''  useEffect(() => {
            let cancelled = false;

            void listLocalX01MatchArchives()
              .then((localRecords) => {
                if (cancelled) return;
                setRecords(localRecords);
                setLoadError("");
                setIsLoading(false);
              })
              .catch((error) => {
                if (cancelled) return;
                console.error("Could not load local completed-match history.", error);
                setLoadError("Completed match history could not be loaded from this browser.");
                setIsLoading(false);
              });

            return () => {
              cancelled = true;
            };
          }, []);'''
          new_effect = '''  useEffect(() => {
            let cancelled = false;

            const loadHistory = () => {
              void listLocalX01MatchArchives()
                .then((localRecords) => {
                  if (cancelled) return;
                  setRecords(localRecords);
                  setLoadError("");
                  setIsLoading(false);
                })
                .catch((error) => {
                  if (cancelled) return;
                  console.error("Could not load local completed-match history.", error);
                  setLoadError("Completed match history could not be loaded from this browser.");
                  setIsLoading(false);
                });
            };

            const handleArchiveChange = () => loadHistory();
            loadHistory();
            window.addEventListener(LOCAL_ARCHIVE_CHANGED_EVENT, handleArchiveChange);

            return () => {
              cancelled = true;
              window.removeEventListener(
                LOCAL_ARCHIVE_CHANGED_EVENT,
                handleArchiveChange,
              );
            };
          }, []);'''
          assert text.count(old_effect) == 1, "History effect marker changed"
          text = text.replace(old_effect, new_effect)

          text = text.replace(
            "Completed matches saved on this device. Server synchronization is not enabled yet.",
            "Completed matches saved on this device. Signed-in accounts synchronize this archive across devices.",
          )
          path.write_text(text)

      - name: Update tester notes
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/AppSettings.tsx")
          text = path.read_text()
          text = text.replace(
            "<li>Completed matches are archived locally for future sync, but they are not uploaded to a server yet.</li>",
            "<li>Completed matches synchronize across devices only while signed in; signed-out scoring remains device-local.</li>",
          )
          marker = "<li>Complete a match, then replay/clear/refresh and confirm normal scoring still behaves correctly</li>"
          replacement = marker + "\n              <li>Create/sign into an account, sync a completed match, then confirm it appears in another signed-in browser</li>\n              <li>Finish a match offline, reconnect, and confirm the pending archive synchronizes</li>"
          assert text.count(marker) == 1, "Tester note marker changed"
          text = text.replace(marker, replacement)
          path.write_text(text)

      - name: Remove one-time workflow
        run: rm .github/workflows/bootstrap-sync-copy.yml

      - name: Commit UI updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/LocalMatchHistory.tsx components/AppSettings.tsx .github/workflows/bootstrap-sync-copy.yml
          git commit -m 'Refresh History and tester notes for sync' || exit 0
          git push
