name: Bootstrap persistent match migration

on:
  push:
    branches:
      - agent/persistent-match-model

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/bootstrap.db
      DATABASE_AUTH_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate migration
        run: npm run db:generate

      - name: Commit generated migration
        run: |
          git add drizzle/
          if git diff --cached --quiet; then
            echo "Migration is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate persistent match model migration"
          git push origin HEAD:${GITHUB_REF_NAME}
