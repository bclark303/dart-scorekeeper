name: Bootstrap database setup effect lint fix

on:
  push:
    branches:
      - agent/database-setup-preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/database-setup-preview

      - name: Make initial database status load effect-safe
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/DatabaseSetupPanel.tsx")
          text = path.read_text()

          old = "  useEffect(() => {\n    void refreshStatus();\n  }, [refreshStatus]);"
          new = """  useEffect(() => {
            let cancelled = false;

            void fetch("/api/setup/database/status", { cache: "no-store" })
              .then(async (response) => {
                if (!response.ok) {
                  throw new Error("Database setup status request failed.");
                }
                return (await response.json()) as DatabaseSetupStatus;
              })
              .then((nextStatus) => {
                if (cancelled) return;
                setStatus(nextStatus);
                setIsLoadingStatus(false);
                onStatusChange?.(nextStatus);
                window.dispatchEvent(new Event(DATABASE_SETUP_CHANGED_EVENT));

                if (nextStatus.current.provider !== "unknown") {
                  setProvider(nextStatus.current.provider);
                } else if (nextStatus.runtime === "cloudflare") {
                  setProvider("d1");
                } else if (nextStatus.runtime === "self-hosted") {
                  setProvider("sqlite");
                }
              })
              .catch((error) => {
                if (cancelled) return;
                console.error("Could not load database setup status.", error);
                setStatus(null);
                setIsLoadingStatus(false);
                onStatusChange?.(null);
                setActionError("Database setup status could not be loaded.");
              });

            return () => {
              cancelled = true;
            };
          }, [onStatusChange]);"""

          assert text.count(old) == 1, "Initial setup status effect marker changed"
          path.write_text(text.replace(old, new))

      - name: Remove one-time workflow
        run: rm .github/workflows/bootstrap-fix-database-setup-effect.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/DatabaseSetupPanel.tsx .github/workflows/bootstrap-fix-database-setup-effect.yml
          git commit -m 'Fix database setup status effect lint'
          git push
