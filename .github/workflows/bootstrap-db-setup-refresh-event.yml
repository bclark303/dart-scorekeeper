name: Bootstrap database setup refresh event

on:
  push:
    branches:
      - agent/database-setup-preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/database-setup-preview

      - name: Broadcast setup status changes
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/DatabaseSetupPanel.tsx")
          text = path.read_text()

          old_import = '''import type {
            DatabaseConnectionDraft,
            DatabaseSetupActionResponse,
            DatabaseSetupProvider,
            DatabaseSetupStatus,
          } from "@/lib/setup/contracts";'''
          new_import = '''import {
            DATABASE_SETUP_CHANGED_EVENT,
            type DatabaseConnectionDraft,
            type DatabaseSetupActionResponse,
            type DatabaseSetupProvider,
            type DatabaseSetupStatus,
          } from "@/lib/setup/contracts";'''
          assert text.count(old_import) == 1, "Setup contract import marker changed"
          text = text.replace(old_import, new_import)

          first = "      onStatusChange?.(nextStatus);"
          first_replacement = first + "\n      window.dispatchEvent(new Event(DATABASE_SETUP_CHANGED_EVENT));"
          assert text.count(first) == 1, "Status refresh callback marker changed"
          text = text.replace(first, first_replacement)

          second = "        onStatusChange?.(result.status);"
          second_replacement = second + "\n        window.dispatchEvent(new Event(DATABASE_SETUP_CHANGED_EVENT));"
          assert text.count(second) == 1, "Saved status callback marker changed"
          text = text.replace(second, second_replacement)

          path.write_text(text)

      - name: Remove one-time workflow
        run: rm .github/workflows/bootstrap-db-setup-refresh-event.yml

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/DatabaseSetupPanel.tsx .github/workflows/bootstrap-db-setup-refresh-event.yml
          git commit -m 'Refresh sync after database setup changes'
          git push
