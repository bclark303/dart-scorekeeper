name: Portable persistence check

on:
  push:
    branches:
      - main
      - internal/game-night-fixture-rotation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Verify Drizzle migrations are committed
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git status --porcelain -- drizzle/)"

      - name: Apply migrations to local SQLite/libSQL
        run: npm run db:migrate

      - name: Exercise database repository contract
        run: npm run db:test

      - name: Exercise browser archive queue contract
        run: npm run local:test

      - name: Exercise authentication and sync ownership contract
        run: npm run auth:test

      - name: Exercise self-hosted database setup contract
        run: npm run setup:test

      - name: Exercise shared X01 rules contract
        run: npm run x01:test

      - name: Exercise league framework contract
        run: npm run league:test

      - name: Exercise league player and roster contract
        run: npm run league:roster:test

      - name: Exercise game-night lifecycle contract
        run: npm run game-night:test

      - name: Exercise Game Night stats and Best-of contract
        run: npm run game-night:stats:test

      - name: Exercise multi-board Game Night completion contract
        run: npm run game-night:multi-board:test

      - name: Exercise fixture and rotation engine contract
        run: npm run game-night:fixtures:test

      - name: Exercise dummy scoring rules contract
        run: npm run dummy-scoring:test

      - name: Exercise central league match contract
        run: npm run league-match:test

      - name: Exercise board device connector contract
        run: npm run board-device:test

      - name: Exercise board device pairing contract
        run: npm run board-device:pairing:test

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-portability .
