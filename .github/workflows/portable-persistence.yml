name: Portable persistence check

on:
  push:
    branches:
      - agent/portable-persistence-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm install is intentional until this foundation run commits the
      # refreshed lockfile. Once generated artifacts are committed, later runs
      # should produce no dependency diff.
      - name: Install dependencies
        run: npm install

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Generate Drizzle migrations
        run: npm run db:generate

      - name: Apply migrations to local SQLite/libSQL
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-portability .

      - name: Commit generated lockfile and migrations
        if: github.event_name == 'push'
        run: |
          git add package-lock.json drizzle/
          if git diff --cached --quiet; then
            echo "Generated persistence files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit persistence lockfile and migrations"
          git push origin HEAD:${GITHUB_REF_NAME}
