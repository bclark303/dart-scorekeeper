name: Portable persistence check

on:
  push:
    branches:
      - agent/portable-persistence-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Generate Drizzle migrations
        run: npm run db:generate

      - name: Apply migrations to local SQLite/libSQL
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Upload generated persistence files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-persistence-generated
          if-no-files-found: warn
          path: |
            package-lock.json
            drizzle/
