name: Bootstrap auth schema and dependencies

on:
  push:
    branches:
      - agent/auth-sync

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/auth-sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Better Auth dependencies
        run: npm install better-auth@1.6.25 @better-auth/drizzle-adapter@1.6.25

      - name: Write runtime auth files
        shell: bash
        run: |
          mkdir -p lib/auth 'app/api/auth/[...all]' data
          cat > lib/auth/server.ts <<'EOF'
          import { betterAuth } from "better-auth";
          import { drizzleAdapter } from "@better-auth/drizzle-adapter";

          import { getDatabase } from "@/lib/db/client";
          import * as authSchema from "@/lib/db/auth-schema";

          function getAuthBaseUrl() {
            const configuredUrl = process.env.BETTER_AUTH_URL?.trim();

            if (configuredUrl) {
              return configuredUrl;
            }

            return {
              allowedHosts: ["localhost:*", "127.0.0.1:*", "*.vercel.app"],
              protocol: "auto" as const,
            };
          }

          function createAuth() {
            return betterAuth({
              appName: "Dart Scorekeeper",
              baseURL: getAuthBaseUrl(),
              database: drizzleAdapter(getDatabase(), {
                provider: "sqlite",
                schema: authSchema,
              }),
              emailAndPassword: {
                enabled: true,
                minPasswordLength: 8,
                maxPasswordLength: 128,
              },
              session: {
                expiresIn: 60 * 60 * 24 * 30,
                updateAge: 60 * 60 * 24,
                deferSessionRefresh: true,
              },
              advanced: {
                cookiePrefix: "dart-scorekeeper",
              },
            });
          }

          export type DartScorekeeperAuth = ReturnType<typeof createAuth>;

          let authInstance: DartScorekeeperAuth | undefined;

          export function getAuth(): DartScorekeeperAuth {
            authInstance ??= createAuth();
            return authInstance;
          }

          export async function getRequestSession(request: Request) {
            return getAuth().api.getSession({
              headers: request.headers,
            });
          }
          EOF

          cat > lib/auth/client.ts <<'EOF'
          "use client";

          import { createAuthClient } from "better-auth/react";

          export const authClient = createAuthClient();
          EOF

          cat > 'app/api/auth/[...all]/route.ts' <<'EOF'
          import { getAuth } from "@/lib/auth/server";

          export const runtime = "nodejs";
          export const dynamic = "force-dynamic";

          export async function GET(request: Request) {
            return getAuth().handler(request);
          }

          export async function POST(request: Request) {
            return getAuth().handler(request);
          }
          EOF

      - name: Generate Better Auth Drizzle schema
        env:
          NODE_ENV: development
          DATABASE_URL: file:./data/auth-bootstrap.db
          DATABASE_AUTH_TOKEN: ""
          BETTER_AUTH_SECRET: bootstrap-only-secret-please-never-use-in-production
          BETTER_AUTH_URL: http://localhost:3000
        run: npx auth@1.6.25 generate --config ./scripts/auth-schema-config.ts --output ./lib/db/auth-schema.ts --yes

      - name: Generate Drizzle migration
        env:
          DATABASE_URL: file:./data/auth-bootstrap.db
          DATABASE_AUTH_TOKEN: ""
        run: npm run db:generate

      - name: Remove one-time workflow
        run: rm .github/workflows/bootstrap-auth-sync.yml

      - name: Commit generated auth foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json lib/auth lib/db/auth-schema.ts app/api/auth drizzle .github/workflows/bootstrap-auth-sync.yml
          git commit -m 'Generate Better Auth schema and migration' || exit 0
          git push
