name: Bootstrap provider preview usability polish

on:
  push:
    branches:
      - agent/database-setup-preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/database-setup-preview

      - name: Keep all provider cards inspectable in preview
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/DatabaseSetupPanel.tsx")
          text = path.read_text()

          disabled_markers = [
            '            disabled={status ? !status.capabilities.canUseLocalSqlite : false}\n',
            '            disabled={status ? !status.capabilities.canUseTurso : false}\n',
            '            disabled={status ? !status.capabilities.canUseD1 : false}\n',
          ]
          for marker in disabled_markers:
            assert marker in text, f"Provider disabled marker changed: {marker.strip()}"
            text = text.replace(marker, "")

          text = text.replace(
            ' disabled:cursor-not-allowed disabled:opacity-40`}',
            '`}',
          )

          vercel_marker = '{status?.runtime === "vercel" && ('
          assert text.count(vercel_marker) == 1, "Vercel instruction marker changed"
          text = text.replace(
            vercel_marker,
            '{status?.runtime === "vercel" && provider === "turso" && (',
            1,
          )

          cloudflare_marker = '{status?.runtime === "cloudflare" && ('
          assert text.count(cloudflare_marker) == 1, "Cloudflare instruction marker changed"
          text = text.replace(
            cloudflare_marker,
            '{status?.runtime === "cloudflare" && provider === "d1" && (',
            1,
          )

          path.write_text(text)

      - name: Remove one-time workflow
        run: rm .github/workflows/bootstrap-provider-preview-ux.yml

      - name: Commit preview polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/DatabaseSetupPanel.tsx .github/workflows/bootstrap-provider-preview-ux.yml
          git commit -m 'Keep database providers inspectable in preview'
          git push
