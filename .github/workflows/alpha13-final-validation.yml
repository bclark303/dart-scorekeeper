name: Alpha 13 final validation

"on":
  push:
    branches:
      - internal/alpha13-venue-administration

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal/alpha13-venue-administration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify alpha.13 version metadata
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== '0.5.0-alpha.13') throw new Error('package.json version mismatch');
          if (lock.version !== '0.5.0-alpha.13') throw new Error('package-lock top-level version mismatch');
          if (lock.packages?.['']?.version !== '0.5.0-alpha.13') throw new Error('package-lock root package version mismatch');
          const appInfo = fs.readFileSync('lib/appInfo.ts', 'utf8');
          if (!appInfo.includes('APP_VERSION = "0.5.0-alpha.13"')) throw new Error('APP_VERSION mismatch');
          NODE
      - run: npm ci
      - name: Verify Drizzle migration state
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain -- drizzle)"
          npm run db:generate
          after="$(git status --porcelain -- drizzle)"
          if [ "$before" != "$after" ]; then
            echo "::error::Drizzle generated uncommitted migration/schema changes"
            git status --short -- drizzle
            exit 1
          fi
      - name: Prepare database
        run: |
          mkdir -p data
          npm run db:migrate
      - name: Run complete contract suite
        run: |
          npm run db:test
          npm run local:test
          npm run auth:test
          npm run setup:test
          npm run x01:test
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test
          npm run board-device:test
          npm run board-device:offline:test
          npm run board-device:pairing:test
          npm run venue-hardware:test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Docker build
        run: docker build -t dart-scorekeeper-alpha13-final .
      - name: Verify clean source tree
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain -- . ':!data')"
          if [ -n "$unexpected" ]; then
            echo "::error::Validation changed tracked source files"
            echo "$unexpected"
            exit 1
          fi
