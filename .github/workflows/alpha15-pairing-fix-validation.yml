name: Alpha 15 pairing fix validation

"on":
  push:
    branches:
      - internal/alpha15-operator-ux

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run board-device:pairing:test
      - run: npm run board-device:test
      - run: npm run lint
      - run: npm run build
