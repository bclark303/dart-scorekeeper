name: Redesign validation

on:
  push:
    branches:
      - agent/redesign-validation

permissions:
  contents: write

jobs:
  redesign-and-verify:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[run-redesign]')
    runs-on: ubuntu-latest
    env:
      DB_PROVIDER: libsql
      DATABASE_URL: file:./data/ci.db
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: ci-only-dart-scorekeeper-auth-secret-123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: agent/redesign-validation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply agreed redesign
        run: python .github/redesign_apply.py

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare local database directory
        run: mkdir -p data

      - name: Verify Drizzle migrations are unchanged
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle/
          test -z "$(git status --porcelain -- drizzle/)"

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run all contract tests
        run: |
          npm run db:test
          npm run local:test
          npm run auth:test
          npm run setup:test
          npm run x01:test
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test
          npm run board-device:test
          npm run board-device:offline:test
          npm run board-device:pairing:test

      - name: Lint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-redesign-validation .

      - name: Commit clean validated redesign
        run: |
          rm -f .github/redesign_apply.py .github/redesign_code_payload.txt .github/redesign_payload_*.txt .github/workflows/redesign-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Redesign application flow and hierarchy" -m "v0.5.0-alpha.3: introduce the two-path Home experience, focused Casual Play, authenticated League Play workspace, state-aware Game Night dashboard, simplified player/device navigation, contextual help, and graphical-first league scoring while preserving the existing scoring and league engines."
          git push origin HEAD:agent/redesign-validation
