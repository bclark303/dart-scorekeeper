name: Alpha 17 entity navigation v2

on:
  push:
    branches:
      - internal/alpha17-entity-navigation

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply corrected entity drill-down patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/alpha17-entity-navigation.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script_lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in script_lines)
          bad = 'replace_once("lib/appInfo.ts", \'version: "0.5.0-alpha.16"\', \'version: "0.5.0-alpha.17"\')'
          good = 'replace_once("lib/appInfo.ts", \'export const APP_VERSION = "0.5.0-alpha.16";\', \'export const APP_VERSION = "0.5.0-alpha.17";\')'
          if bad not in script:
              raise SystemExit('Could not locate alpha.17 APP_VERSION patch hook.')
          script = script.replace(bad, good)
          exec(compile(script, 'alpha17-entity-navigation-patch.py', 'exec'))

          path = Path('app/league-devices/page.tsx')
          text = path.read_text()
          old = '''  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n    setTargetBoardId(params.get("boardId") ?? "");\n    setTargetDeviceId(params.get("deviceId") ?? "");\n  }, []);'''
          new = '''  useEffect(() => {\n    const timer = window.setTimeout(() => {\n      const params = new URLSearchParams(window.location.search);\n      setTargetBoardId(params.get("boardId") ?? "");\n      setTargetDeviceId(params.get("deviceId") ?? "");\n    }, 0);\n    return () => window.clearTimeout(timer);\n  }, []);'''
          if old not in text:
              raise SystemExit('Could not locate deep-link initialization effect.')
          path.write_text(text.replace(old, new, 1))
          PY
          npm version 0.5.0-alpha.17 --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npm run db:migrate

      - name: Run relevant contracts
        run: |
          npm run db:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:stats:test
          npm run game-night:board-ops:test
          npm run board-device:test
          npm run venue-hardware:test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit clean validated alpha.17
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/alpha17-entity-navigation.yml .github/workflows/alpha17-entity-navigation-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add entity drill-down navigation for alpha.17"
          git push
