name: Internal cursory UI navigation pass

on:
  push:
    branches:
      - internal/cursory-ui-navigation
    paths:
      - .github/workflows/internal-cursory-ui-navigation.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out scratch branch
        uses: actions/checkout@v4
        with:
          ref: internal/cursory-ui-navigation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply navigation pass and bump preview version
        shell: bash
        run: |
          npm version 0.5.0-alpha.2 --no-git-tag-version
          python <<'PY'
          from pathlib import Path

          app = Path("app/page.tsx")
          text = app.read_text()

          start = text.index("  function renderFullNavigation() {")
          end = text.index("\n  function renderGameModeHeader()", start)
          navigation = '''  function renderFullNavigation() {
            return (
              <nav
                className="mb-8 grid gap-3 lg:grid-cols-[2fr_1fr]"
                aria-label="Application sections"
              >
                <div className="rounded-2xl border border-[var(--color-panel-border)] bg-[var(--color-panel)] p-3">
                  <div className="px-1 text-xs font-bold uppercase tracking-[0.14em] text-[var(--color-text-muted)]">
                    Play
                  </div>
                  <div className="mt-2 grid grid-cols-2 gap-2 sm:grid-cols-4">
                    <button
                      onClick={() => setActiveView("score")}
                      className={getTabClass("score")}
                    >
                      Score
                    </button>

                    <button
                      onClick={() => setActiveView("game")}
                      className={getTabClass("game")}
                    >
                      New Match
                    </button>

                    <button
                      onClick={() => setActiveView("stats")}
                      className={getTabClass("stats")}
                    >
                      Stats
                    </button>

                    <button
                      onClick={() => setActiveView("history")}
                      className={getTabClass("history")}
                    >
                      History
                    </button>
                  </div>
                </div>

                <div className="rounded-2xl border border-[var(--color-panel-border)] bg-[var(--color-panel)] p-3">
                  <div className="px-1 text-xs font-bold uppercase tracking-[0.14em] text-[var(--color-text-muted)]">
                    Manage
                  </div>
                  <div className="mt-2 grid grid-cols-2 gap-2">
                    <button
                      onClick={() => setActiveView("league")}
                      className={getTabClass("league")}
                    >
                      League
                    </button>

                    <button
                      onClick={() => setActiveView("app")}
                      className={getTabClass("app")}
                    >
                      Settings
                    </button>
                  </div>
                </div>
              </nav>
            );
          }
'''
          text = text[:start] + navigation + text[end:]
          text = text.replace('return "Game Setup";', 'return "New Match";')
          text = text.replace('return "App Settings";', 'return "Settings";')
          text = text.replace("                  Game Setup\n", "                  New Match\n")
          text = text.replace("                  App Settings\n", "                  Settings\n")
          text = text.replace("                      Game Mode\n", "                      Focused Play\n")
          text = text.replace("                  Show full tabs\n", "                  Exit Focused Play\n")
          app.write_text(text)

          Path("lib/appInfo.ts").write_text('''/**
           * App-level release information.
           *
           * Keep this in one place so the UI, feedback reports,
           * diagnostics, and future release notes all show the same version.
           */
          export const APP_VERSION = "0.5.0-alpha.2";
          '''.replace("          ", ""))

          Path("components/LeagueControlsSection.tsx").write_text('''import Link from "next/link";

const setupCards = [
  {
    href: "/leagues",
    title: "League & Seasons",
    description: "Create the league and organize its competition seasons.",
  },
  {
    href: "/league-roster",
    title: "Players & Rosters",
    description: "Maintain league players and choose the active roster for each season.",
  },
  {
    href: "/game-night-templates",
    title: "Rules Templates",
    description: "Save reusable Game Night rules and choose the league default preset.",
  },
  {
    href: "/league-devices",
    title: "Board Devices",
    description: "Register, pair, and manage the scorer assigned to each physical board.",
  },
] as const;

export function LeagueControlsSection() {
  return (
    <>
      <section className="mb-8 rounded-2xl border border-[var(--color-panel-border)] bg-[var(--color-panel)] p-5 sm:p-6">
        <div className="mb-5">
          <div className="text-sm font-bold uppercase tracking-wide text-[var(--color-text-muted)]">
            League Workspace
          </div>
          <h2 className="mt-1 text-3xl font-bold">League</h2>
          <p className="mt-2 max-w-3xl text-sm text-[var(--color-text-muted)]">
            Run a league night or manage the reusable setup behind it. League administration
            uses Connected Storage; casual play remains local-first and independent.
          </p>
        </div>

        <Link
          href="/game-nights"
          className="group mb-4 block rounded-2xl border border-[var(--color-primary)]/60 bg-[var(--color-panel-soft)] p-5 transition hover:border-[var(--color-primary)] hover:bg-[var(--color-panel-border)]"
        >
          <div className="flex items-center justify-between gap-4">
            <div>
              <div className="text-xs font-bold uppercase tracking-[0.14em] text-[var(--color-primary)]">
                Run / Test
              </div>
              <h3 className="mt-1 text-2xl font-bold">Game Nights</h3>
              <p className="mt-2 max-w-2xl text-sm leading-6 text-[var(--color-text-muted)]">
                Schedule the night, check players in, build teams, review the full fixture
                schedule, populate boards, and follow live matches.
              </p>
            </div>
            <span className="text-2xl text-[var(--color-text-muted)] transition group-hover:translate-x-1 group-hover:text-[var(--color-text-main)]" aria-hidden="true">
              →
            </span>
          </div>
        </Link>

        <div className="grid gap-3 sm:grid-cols-2">
          {setupCards.map((card) => (
            <Link
              key={card.href}
              href={card.href}
              className="group rounded-2xl border border-[var(--color-panel-border)] bg-[var(--color-panel-soft)] p-4 transition hover:border-[var(--color-primary)] hover:bg-[var(--color-panel-border)]"
            >
              <div className="flex items-center justify-between gap-3">
                <h3 className="text-lg font-bold">{card.title}</h3>
                <span aria-hidden="true" className="text-lg text-[var(--color-text-muted)] transition group-hover:translate-x-1">
                  →
                </span>
              </div>
              <p className="mt-2 text-sm leading-6 text-[var(--color-text-muted)]">
                {card.description}
              </p>
            </Link>
          ))}
        </div>
      </section>

      <section className="mb-8 rounded-2xl border border-[var(--color-panel-border)] bg-[var(--color-panel)] p-5 sm:p-6">
        <h2 className="text-xl font-bold">Typical league-night flow</h2>
        <p className="mt-1 text-sm text-[var(--color-text-muted)]">
          Setup areas are reusable; Game Nights are where the live session happens.
        </p>
        <div className="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          {[
            ["1", "League & season", "Choose the competition period."],
            ["2", "Roster", "Confirm who is eligible to play."],
            ["3", "Rules & boards", "Reuse presets and registered devices."],
            ["4", "Game Night", "Check in, build teams, and run the rounds."],
          ].map(([step, title, description]) => (
            <div key={step} className="rounded-xl border border-[var(--color-panel-border)] bg-[var(--color-panel-soft)] p-4">
              <div className="text-xs font-bold uppercase tracking-wide text-[var(--color-text-muted)]">
                Step {step}
              </div>
              <div className="mt-1 font-bold">{title}</div>
              <div className="mt-1 text-sm text-[var(--color-text-muted)]">{description}</div>
            </div>
          ))}
        </div>
      </section>
    </>
  );
}
''')

          layout = '''import { LeagueWorkspaceNav } from "@/components/LeagueWorkspaceNav";

export default function LeagueWorkspaceLayout({
  children,
}: Readonly<{ children: React.ReactNode }>) {
  return (
    <>
      <LeagueWorkspaceNav />
      {children}
    </>
  );
}
'''
          for route in ["leagues", "game-nights", "league-roster", "game-night-templates", "league-devices"]:
              path = Path("app") / route / "layout.tsx"
              path.write_text(layout)

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text()
          added_marker = "### Added\n"
          changed_marker = "### Changed\n"
          changelog_text = changelog_text.replace(
              added_marker,
              added_marker + "- Shared League Workspace navigation across league administration pages.\n- Complete League landing shortcuts for Game Nights, league/season setup, players/rosters, rules templates, and board devices.\n",
              1,
          )
          changelog_text = changelog_text.replace(
              changed_marker,
              changed_marker + "- Grouped the scorer navigation into Play and Manage areas; renamed Game to New Match, App to Settings, and Game Mode to Focused Play.\n- Updated preview version to v0.5.0-alpha.2 for the cursory navigation pass.\n",
              1,
          )
          changelog.write_text(changelog_text)
          PY

      - name: Prepare local database
        run: |
          mkdir -p data
          npm run db:migrate

      - name: Run regression contracts
        run: |
          npm run db:test
          npm run local:test
          npm run auth:test
          npm run setup:test
          npm run x01:test
          npm run league:test
          npm run league:roster:test
          npm run game-night:test
          npm run game-night:templates:test
          npm run game-night:stats:test
          npm run game-night:multi-board:test
          npm run game-night:fixtures:test
          npm run game-night:layout:test
          npm run dummy-scoring:test
          npm run dummy-team-balance:test
          npm run league-match:test
          npm run board-device:test
          npm run board-device:pairing:test
          npm run board-device:offline:test

      - name: Lint and production build
        run: |
          npm run lint
          npm run build

      - name: Build Docker portability target
        run: docker build -t dart-scorekeeper-cursory-ui .

      - name: Commit clean scratch result
        shell: bash
        run: |
          rm .github/workflows/internal-cursory-ui-navigation.yml
          git config user.name "Ben Clark"
          git config user.email "bclark303@gmail.com"
          git add -A
          git commit -m "Apply cursory navigation pass [skip ci]"
          git push origin HEAD:internal/cursory-ui-navigation
