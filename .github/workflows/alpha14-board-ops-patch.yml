name: Alpha 14 board operations patch

"on":
  push:
    branches:
      - internal/alpha14-game-night-board-operations

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal/alpha14-game-night-board-operations
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire alpha.14 UI and lifecycle guards
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/game-nights/control/page.tsx')
          text = path.read_text()
          component_import = 'import { GameNightBoardOperationsPanel } from "@/components/GameNightBoardOperationsPanel";\n'
          if component_import not in text:
            marker = 'import { authClient } from "@/lib/auth/client";\n'
            if marker not in text:
              raise SystemExit('Control import target not found')
            text = text.replace(marker, component_import + marker, 1)
          panel = '''\n\n            <GameNightBoardOperationsPanel\n              leagueId={workspace.leagueId}\n              night={night}\n              onNightChange={workspace.applyNight}\n            />'''
          if '<GameNightBoardOperationsPanel' not in text:
            anchor = text.index('Live Stats')
            section_end = text.index('            </section>', anchor) + len('            </section>')
            text = text[:section_end] + panel + text[section_end:]
          path.write_text(text)

          path = Path('app/game-nights/boards/page.tsx')
          text = path.read_text()
          warning_import = 'import { GameNightBoardPlanningWarnings } from "@/components/GameNightBoardPlanningWarnings";\n'
          if warning_import not in text:
            marker = 'import { GameNightWorkspacePicker } from "@/components/GameNightWorkspacePicker";\n'
            if marker not in text:
              raise SystemExit('Boards import target not found')
            text = text.replace(marker, marker + warning_import, 1)
          warning_panel = '          <GameNightBoardPlanningWarnings night={night} />\n'
          if '<GameNightBoardPlanningWarnings' not in text:
            marker = '        <div className="mt-6 space-y-6">\n'
            if marker not in text:
              raise SystemExit('Boards warning insertion target not found')
            text = text.replace(marker, marker + warning_panel, 1)
          path.write_text(text)

          path = Path('lib/db/repositories/venueHardware.ts')
          text = path.read_text()
          old_select = '''      physicalBoardId: gameNightBoards.physicalBoardId,\n      boardNumber: physicalBoards.boardNumber,\n      boardName: physicalBoards.name,'''
          new_select = '''      physicalBoardId: gameNightBoards.physicalBoardId,\n      boardNumber: physicalBoards.boardNumber,\n      boardName: physicalBoards.name,\n      boardStatus: physicalBoards.status,'''
          if 'boardStatus: physicalBoards.status' not in text:
            if old_select not in text:
              raise SystemExit('Board availability select target not found')
            text = text.replace(old_select, new_select, 1)
          guard = '''\n  const unavailable = target.filter(\n    (board) => !board.physicalBoardId || board.boardStatus !== "active",\n  );\n  if (unavailable.length) {\n    const boardNames = unavailable.map(\n      (board) => board.boardName || `Board ${board.boardNumber ?? "?"}`,\n    );\n    throw new Error(\n      `${boardNames.join(", ")} ${boardNames.length === 1 ? "is" : "are"} unavailable or out of service. Choose active physical boards before starting the Game Night.`,\n    );\n  }\n'''
          if 'unavailable or out of service' not in text:
            marker = '  if (!targetIds.length) throw new Error("Assign physical boards before starting the Game Night.");\n'
            if marker not in text:
              raise SystemExit('Board availability guard target not found')
            text = text.replace(marker, marker + guard, 1)
          path.write_text(text)

          path = Path('package.json')
          text = path.read_text()
          script = '    "game-night:board-ops:test": "tsx scripts/game-night-board-operations-contract-test.ts",\n'
          if script not in text:
            marker = '    "venue-hardware:test": "tsx scripts/venue-hardware-contract-test.ts",\n'
            if marker not in text:
              raise SystemExit('package script target not found')
            text = text.replace(marker, marker + script, 1)
          path.write_text(text)
      - run: npm ci
      - name: Prepare database
        run: |
          mkdir -p data
          npm run db:migrate
      - name: Validate board operations
        run: |
          npm run game-night:board-ops:test
          npm run venue-hardware:test
          npm run game-night:test
          npm run board-device:test
          npm run board-device:pairing:test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit alpha.14 implementation wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/game-nights/control/page.tsx app/game-nights/boards/page.tsx lib/db/repositories/venueHardware.ts package.json
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "Wire live Game Night board operations"
            git push origin HEAD:internal/alpha14-game-night-board-operations
          fi
